# Deployment compose — builds this repo's Dockerfile and runs the webapp.
#
# This is the single compose file of the repo. `docker compose up --build`
# builds from source (no prebuilt image to push) and serves the webapp on
# port 8000. The same file is used by Coolify-like deployments: Coolify's
# proxy handles routing/TLS, so nothing is published to the host there.
#
# This repo is PUBLIC and must never contain real credentials. Every value
# below is interpolated from the environment (a local `.env` file or the
# deployment's env vars, e.g. Coolify "Environment Variables").
# Required vars: SECRET_KEY, OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET,
# OIDC_REDIRECT_URI, FRED_API_KEY — copy .env.example and fill them in.

services:
  webapp:
    build: .
    container_name: tradingagents-webapp
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI}
      - FRED_API_KEY=${FRED_API_KEY}
    volumes:
      # app/data is where the SQLite DB lives (webapp/database.py →
      # <repo root>/data/trading.db). Volume names are explicit so data
      # survives container recreation under any compose project name.
      - tradingagents-data:/home/appuser/.tradingagents
      - tradingagents-webapp-data:/home/appuser/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  tradingagents-data:
    name: tradingagents-data
  tradingagents-webapp-data:
    name: tradingagents-webapp-data
